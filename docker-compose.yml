# /docker-compose.yml

version: '3.8'

services:
  backend:
    build: ./backend
    container_name: truetag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: truetag_frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: always